<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRINT//TRACE</title>
<style>
  :root {
    --bg:#05080c; --cy:#4de2ff; --cy2:rgba(77,226,255,.55); --cy3:rgba(77,226,255,.18); --cy4:rgba(77,226,255,.07);
    --amb:#ffb547; --hot:#ff5d5d; --ok:#5ef2a0; --fg:#d8f6ff; --dim:#6f8796; --dim2:#3c4c58;
    --mono: "SF Mono", ui-monospace, Menlo, "PingFang TC", monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font:12px/1.4 -apple-system,"PingFang TC",system-ui,sans-serif; -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none; }
  #view { position:fixed; inset:0;
    background: radial-gradient(ellipse at 50% 40%, #0d1822 0%, #070b10 55%, #030507 100%); }
  canvas#gl { position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* 掃描線與暗角 */
  #fx { position:absolute; inset:0; pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
  .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .tag { font:600 11px/1 var(--mono); letter-spacing:.16em; color:var(--dim); text-transform:uppercase; }

  /* HUD 面板：半透明 + 四角括號 */
  .pane { position:absolute; padding:12px 14px; background:linear-gradient(180deg, rgba(10,20,28,.62), rgba(6,12,18,.5));
    border:1px solid var(--cy3); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .pane::before, .pane::after { content:""; position:absolute; width:10px; height:10px; border:1.5px solid var(--cy); pointer-events:none; }
  .pane::before { top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .pane::after { bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .pane .hd { display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .pane .hd .tag { color:var(--cy); }
  .pane .hd .ln { flex:1; height:1px; background:linear-gradient(90deg, var(--cy3), transparent); }

  /* 左上：檔案資訊 */
  #brand { top:16px; left:16px; display:flex; gap:12px; align-items:center; padding:10px 14px 10px 10px; }
  #thumb { width:54px; height:54px; object-fit:contain; background:rgba(77,226,255,.05); border:1px solid var(--cy3); }
  #brand .t1 { font:700 14px/1 var(--mono); letter-spacing:.18em; color:var(--cy); }
  #brand .t1 i { font-style:normal; color:var(--dim); }
  #brand .t2 { font-size:18px; font-weight:600; margin:5px 0 4px; }
  #brand .t3 { color:var(--dim); font:12.5px/1.35 var(--mono); }

  /* 右上：進度環 */
  #prog { top:16px; right:16px; display:flex; gap:14px; align-items:center; padding:12px 16px; }
  #ring { width:92px; height:92px; position:relative; }
  #ring svg { transform:rotate(-90deg); overflow:visible; }   /* 光暈超出方框也要畫出來，不然會被切掉 */
  #ring .pct { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #ring .pct b { font:600 22px/1 var(--mono); color:var(--fg); }
  #ring .pct span { font:10px/1 var(--mono); color:var(--dim); letter-spacing:.14em; margin-top:4px; }
  #prog .kv { display:grid; grid-template-columns:auto auto; gap:3px 14px; align-items:baseline; }
  #prog .kv .v { font:500 19px/1.25 var(--mono); text-align:right; }
  #prog .kv .v.big { font-size:40px; line-height:1; color:var(--cy); text-shadow:0 0 12px rgba(77,226,255,.45); }
  #prog .kv .v small { color:var(--dim); font-size:15px; }

  /* 左中：即時數據 */
  #tele { bottom:96px; right:16px; width:320px; }
  #tele .feat { display:flex; align-items:center; gap:8px; font-size:18px; font-weight:600; margin-bottom:10px; }
  #tele .feat i { width:9px; height:9px; box-shadow:0 0 10px currentColor; background:currentColor; }
  #tele .spd { display:flex; align-items:baseline; gap:6px; }
  #tele .spd b { font:300 44px/1 var(--mono); letter-spacing:-.02em; }
  #tele .spd span { color:var(--dim); font:14px var(--mono); }
  #tele .bars { margin:8px 0 10px; display:grid; gap:5px; }
  #tele .bar { display:grid; grid-template-columns:62px 1fr 64px; align-items:center; gap:8px; }
  #tele .bar .tr { height:4px; background:var(--cy4); position:relative; overflow:hidden; }
  #tele .bar .tr div { position:absolute; inset:0 auto 0 0; background:var(--cy); box-shadow:0 0 8px var(--cy); }
  #tele .bar .tr.amb div { background:var(--amb); box-shadow:0 0 8px var(--amb); }
  #tele .bar .v { text-align:right; font:13px var(--mono); }
  #spark { width:100%; height:52px; display:block; border-top:1px solid var(--cy4); border-bottom:1px solid var(--cy4); }
  #tele .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  #tele .grid3 .v { font:500 16px/1.3 var(--mono); }

  /* 右側：準備流程 / 圖例 + 層數量尺 */
  #side { top:150px; right:16px; width:310px; }
  .step { display:grid; grid-template-columns:16px 1fr auto; gap:8px; align-items:center; padding:5px 0; color:var(--dim2); font-size:15px; }
  .step .ic { font:13px var(--mono); text-align:center; }
  .step .d { font:13px var(--mono); }
  .step.done { color:var(--dim); } .step.done .ic { color:var(--ok); }
  .step.skip { color:var(--dim2); text-decoration:line-through; }
  .step.cur { color:var(--fg); font-weight:600; } .step.cur .ic { color:var(--amb); animation:blink 1s steps(2) infinite; }
  .step.cur .d { color:var(--amb); }
  .sbar.run div { width:30% !important; animation:scan 1.6s ease-in-out infinite alternate; }
  @keyframes scan { from { margin-left:0; } to { margin-left:70%; } }
  .sbar { height:2px; background:var(--cy4); margin:1px 0 4px 24px; } .sbar div { height:100%; background:var(--amb); box-shadow:0 0 6px var(--amb); }
  .cd { display:flex; align-items:baseline; justify-content:space-between; margin:-2px 0 10px; padding-bottom:8px; border-bottom:1px solid var(--cy4); }
  .cd b { font:300 30px/1 var(--mono); color:var(--amb); letter-spacing:.02em; text-shadow:0 0 10px rgba(255,181,71,.35); }
  .temps { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .temp { border:1px solid var(--cy3); padding:7px 9px; background:rgba(255,93,93,.03); }
  .temp b { display:block; font:300 30px/1.1 var(--mono); color:var(--fg); }
  .temp b small { font-size:14px; color:var(--dim); }
  .waiting { margin-top:10px; font:13px var(--mono); color:var(--amb); letter-spacing:.04em; animation:blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:.35; } }
  .leg { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; }
  .leg div { display:flex; align-items:center; gap:7px; color:#b6cfdb; font-size:11.5px; }
  .leg i { width:8px; height:8px; flex:none; }
  .grad { height:6px; margin:4px 0 3px; } .gl { display:flex; justify-content:space-between; font:10px var(--mono); color:var(--dim); }

  #lgauge { position:absolute; right:16px; top:50%; height:0; }
  #lg { position:absolute; right:22px; width:30px; top:150px; bottom:330px; cursor:ns-resize; }
  #lg .rail { position:absolute; left:13px; width:4px; top:0; bottom:0; background:repeating-linear-gradient(0deg, var(--cy3) 0 1px, transparent 1px 6px); }
  #lg .fill { position:absolute; left:13px; width:4px; bottom:0; background:linear-gradient(0deg, rgba(77,226,255,.25), var(--cy)); box-shadow:0 0 10px var(--cy2); }
  #lg .mk { position:absolute; right:22px; transform:translateY(50%); font:600 13px var(--mono); color:var(--cy); white-space:nowrap; }
  #lg .mk::after { content:""; position:absolute; right:-14px; top:50%; width:12px; height:1px; background:var(--cy); }
  #lg .top, #lg .bot { position:absolute; right:22px; font:9px var(--mono); color:var(--dim); }
  #lg .top { top:-4px; } #lg .bot { bottom:-4px; }

  /* 噴頭標籤 */
  #lead { position:absolute; inset:0; pointer-events:none; overflow:visible; }
  #callout { position:absolute; pointer-events:none; padding:5px 9px; border:1px solid var(--cy2); background:rgba(4,10,16,.78);
    font:13px/1.4 var(--mono); white-space:nowrap; }
  #callout b { color:var(--cy); font-weight:600; }

  /* 左下：G-code 串流 */
  #term { left:16px; bottom:96px; width:360px; padding:10px 12px; }
  #code { font:12.5px/1.6 var(--mono); white-space:pre; overflow:hidden; color:var(--dim2); }
  #code .c { color:var(--cy); background:rgba(77,226,255,.08); display:block; margin:0 -12px; padding:0 12px; border-left:2px solid var(--cy); }
  #code .n { color:#2e3d48; display:inline-block; width:50px; }
  #code .c .n { color:var(--cy2); }

  /* 底部時間軸 */
  #dock { left:16px; right:16px; bottom:16px; padding:10px 14px 12px; display:grid; grid-template-columns:auto 1fr auto; gap:6px 14px; align-items:center; }
  #play { width:38px; height:38px; border:1px solid var(--cy2); background:rgba(77,226,255,.06); color:var(--cy); font-size:14px; cursor:pointer; grid-row:span 2; }
  #play:hover { background:rgba(77,226,255,.16); }
  #track { position:relative; height:22px; cursor:pointer; touch-action:none; }
  #segs { position:absolute; left:0; right:0; top:9px; height:4px; background:var(--cy4); }
  #segs div { position:absolute; top:0; bottom:0; opacity:.9; }
  #fill { position:absolute; left:0; top:9px; height:4px; background:var(--cy); box-shadow:0 0 10px var(--cy); opacity:.85; }
  #head { position:absolute; top:2px; width:2px; height:18px; background:#fff; box-shadow:0 0 8px var(--cy); transform:translateX(-1px); }
  #ticks { position:absolute; left:0; right:0; top:16px; height:4px; }
  #ticks div { position:absolute; width:1px; height:4px; background:var(--dim2); }
  .trow { display:flex; justify-content:space-between; font:10.5px var(--mono); color:var(--dim); }
  .trow b { color:var(--fg); font-weight:500; }
  #ctl { display:flex; gap:4px; grid-row:span 2; align-items:center; }
  .btn { border:1px solid var(--cy3); background:transparent; color:var(--dim); font:12.5px var(--mono); padding:5px 7px; cursor:pointer; }
  .btn:hover { color:var(--fg); border-color:var(--cy2); }
  .btn.on { color:#001018; background:var(--cy); border-color:var(--cy); }

  /* 設定選單 */
  #menu { top:16px; right:16px; display:none; }
  #gear { position:absolute; top:16px; right:16px; }
  #settings { position:absolute; top:150px; left:50%; transform:translateX(-50%); width:280px; display:none; z-index:5; }
  #settings label { display:flex; align-items:center; gap:8px; padding:4px 0; cursor:pointer; color:#b6cfdb; }
  ::selection { background:transparent; }
  #settings select { width:100%; margin:4px 0 8px; background:#081118; color:var(--fg); border:1px solid var(--cy3); padding:5px; font:12px var(--mono); }
  #settings input[type=checkbox] { accent-color:var(--cy); }
  #topbtns { position:absolute; top:16px; left:50%; transform:translateX(-50%); display:flex; gap:6px; }

  #drop { position:absolute; inset:0; display:flex; flex-direction:column; gap:10px; align-items:center; justify-content:center; color:var(--dim); font:13px var(--mono); letter-spacing:.1em; }
  #drop b { color:var(--cy); font-size:20px; letter-spacing:.3em; }
  #drop.hl { background:rgba(77,226,255,.05); outline:1px dashed var(--cy); outline-offset:-20px; }
  .hide { display:none !important; }
  /* 列印完成 */
  #done { left:50%; bottom:28px; transform:translate(-50%, 30px); opacity:0; pointer-events:none; min-width:520px; padding:18px 26px 20px;
    transition:opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1); border-color:rgba(94,242,160,.35); }
  #done::before, #done::after { border-color:var(--ok); }
  body.done #done { opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
  body.done #tele, body.done #term, body.done #side, body.done #callout { opacity:0 !important; pointer-events:none; transition:opacity .6s; }
  body.done:not(.live) #done { bottom:100px; }
  body.done #arc { stroke:var(--ok); filter:drop-shadow(0 0 5px var(--ok)) !important; }
  #done .ttl { display:flex; align-items:center; gap:12px; }
  #done .ttl .ck { width:34px; height:34px; border:1.5px solid var(--ok); display:flex; align-items:center; justify-content:center; color:var(--ok); font-size:18px; box-shadow:0 0 14px rgba(94,242,160,.35); }
  #done .ttl b { font:600 22px/1.1 -apple-system,"PingFang TC",sans-serif; color:var(--fg); }
  #done .ttl span { display:block; font:600 11px/1 var(--mono); letter-spacing:.3em; color:var(--ok); margin-top:5px; }
  #done .nm { font-size:15px; color:#b6cfdb; margin:12px 0 14px; }
  #done .st { display:grid; grid-template-columns:repeat(4, auto); gap:6px 28px; }
  #done .st .v { font:300 24px/1.15 var(--mono); color:var(--fg); }
  #done .st .v small { font-size:13px; color:var(--dim); margin-left:2px; }
  #done .fl { display:flex; gap:14px; margin-top:12px; font:12px var(--mono); color:var(--dim); }
  #done .fl i { display:inline-block; width:10px; height:10px; margin-right:5px; vertical-align:-1px; border:1px solid rgba(255,255,255,.3); }
  @media (max-width: 700px) { #done { min-width:0; left:16px; right:16px; transform:translateY(30px); } body.done #done { transform:none; } #done .st { grid-template-columns:repeat(2, auto); } }
  /* 即時模式不需要底部時間軸，下方面板往下貼齊 */
  body.live #dock, body.live #lg { display:none !important; }
  body.live #tele, body.live #term { bottom:16px; }
  @media (max-width: 700px) { body.live #prog { bottom:16px; } body.live #tele { bottom:136px; } }
  /* 窄畫面（例如嵌在 Orca 的攝影機格、手機）：收掉次要面板 */
  @media (max-width: 1100px) {
    #term { display:none; }
    #topbtns { left:16px; right:auto; transform:none; top:132px; }
    #tele, #side { width:280px; }
    #brand .t3 { font-size:12px; }
    #lg { display:none; }
  }
  @media (max-width: 700px) {
    #brand { right:16px; } #brand .t3, #thumb { display:none; }
    #prog { top:auto; bottom:84px; right:16px; left:16px; padding:8px 12px; justify-content:space-between; }
    #ring { width:64px; height:64px; } #ring svg { width:64px; height:64px; }
    #side { top:92px; width:auto; left:16px; right:16px; }
    #tele { width:auto; left:16px; right:16px; bottom:200px; padding:10px 12px; }
    #tele .spd b { font-size:30px; } #tele .bars, #tele .grid3:not(#liveTemps) { display:none; }
    #topbtns { display:none; }
  }
  .zlab { position:absolute; pointer-events:none; transform:translate(-50%,-100%); font:11.5px/1.4 var(--mono); letter-spacing:.12em; color:rgba(77,226,255,.55); white-space:nowrap; text-align:center; transition:color .3s; }
  .zlab.on { color:var(--amb); text-shadow:0 0 8px rgba(255,181,71,.6); font-weight:600; }
  .anno { position:absolute; pointer-events:none; font:9.5px/1.45 var(--mono); letter-spacing:.14em; color:var(--cy); text-transform:uppercase; white-space:nowrap; transform:translate(-50%,-100%); text-align:center; }
  .anno span { display:block; color:var(--dim); letter-spacing:.06em; font-size:9px; text-transform:none; }
  .chip { display:inline-block; width:10px; height:10px; border:1px solid rgba(255,255,255,.35); vertical-align:-1px; margin-right:4px; }
  .fils { margin-top:5px; display:flex; gap:8px; flex-wrap:wrap; font:12px var(--mono); color:var(--dim); }
  #tcBadge { color:var(--amb); }
  /* 開場 */
  #hudRoot > * { transition: opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1); }
  #hudRoot.intro > * { opacity:0; pointer-events:none; }
  #hudRoot.intro > #brand, #hudRoot.intro > #tele, #hudRoot.intro > #term { transform:translateX(-24px); }
  #hudRoot.intro > #prog, #hudRoot.intro > #side, #hudRoot.intro > #lg { transform:translateX(24px); }
  #hudRoot.intro > #dock { transform:translateY(24px); }
  #hudRoot > #tele, #hudRoot > #side { transition-delay:.12s; } #hudRoot > #term, #hudRoot > #lg { transition-delay:.24s; } #hudRoot > #dock { transition-delay:.34s; }
  #hudRoot.intro > * { transition-delay:0s !important; }
  #introTxt { position:absolute; left:50%; bottom:64px; transform:translateX(-50%); text-align:center; font:11px/1.7 var(--mono);
    letter-spacing:.28em; color:var(--cy); pointer-events:none; transition:opacity .5s; text-shadow:0 0 8px rgba(77,226,255,.6); }
  #introTxt b { display:block; font-size:22px; letter-spacing:.12em; color:var(--fg); font-weight:300; }
  #introTxt .sk { color:var(--dim); letter-spacing:.1em; margin-top:6px; }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/" } }
</script>
</head>
<body>
<div id="view">
  <canvas id="gl"></canvas>
  <div id="fx"></div>
  <div id="annoBox"></div><div id="zoneBox"></div>
  <svg id="lead"><g id="annoLines"></g><line id="leadL" stroke="#4de2ff" stroke-opacity=".7" stroke-width="1"/><circle id="leadC" r="3" fill="none" stroke="#4de2ff"/></svg>
  <div id="callout" class="hide"></div>
  <div id="introTxt" style="opacity:0"></div>

  <div id="drop"><b>PRINT//TRACE</b>把 .gcode.3mf 或 .gcode 拖進來<button class="btn" onclick="document.getElementById('file').click()">選擇檔案</button></div>
  <input type="file" id="file" accept=".3mf,.gcode,.gco" class="hide">

  <div id="hudRoot" class="hide">
    <div id="brand" class="pane">
      <img id="thumb" alt="">
      <div>
        <div class="t1">PRINT<i>//</i>TRACE</div>
        <div class="t2" id="fname">—</div>
        <div class="t3" id="spec">—</div>
      </div>
    </div>

    <div id="topbtns">
      <button class="btn" id="openBtn">開啟檔案</button>
      <button class="btn" id="setBtn">顯示設定</button>
      <button class="btn" id="followBtn">跟隨噴頭 F</button>
      <button class="btn" id="replayBtn">重播開場</button>
      <span class="btn hide" id="liveBadge" style="cursor:default"></span>
      <button class="btn hide" id="backLive">回到即時</button>
    </div>

    <div id="prog" class="pane">
      <div id="ring">
        <svg width="92" height="92" viewBox="0 0 92 92"><circle cx="46" cy="46" r="40" fill="none" stroke="rgba(77,226,255,.1)" stroke-width="4"/>
          <circle cx="46" cy="46" r="40" fill="none" stroke="rgba(77,226,255,.12)" stroke-width="10" stroke-dasharray="1 5.28"/>
          <circle id="arc" cx="46" cy="46" r="40" fill="none" stroke="#4de2ff" stroke-width="4" stroke-linecap="butt" style="filter:drop-shadow(0 0 4px #4de2ff)"/></svg>
        <div class="pct"><b id="pct">0%</b><span>PROGRESS</span></div>
      </div>
      <div class="kv">
        <span class="tag">層 LAYER</span><span class="v big" id="kLayer">0<small>/0</small></span>
        <span class="tag">已過 ELAPSED</span><span class="v" id="kEl">0:00</span>
        <span class="tag">剩餘 REMAIN</span><span class="v" id="kRem">0:00</span>
        <span class="tag">完成 ETA</span><span class="v" id="kEta">--:--</span>
      </div>
    </div>

    <div id="tele" class="pane">
      <div class="hd"><span class="tag">即時數據 TELEMETRY</span><span class="ln"></span></div>
      <div class="feat" id="feat"><i></i><span>—</span></div>
      <div class="spd"><b id="spd">0</b><span>mm/s　估算</span></div>
      <div class="bars">
        <div class="bar"><span class="tag">設定 F</span><div class="tr"><div id="bF"></div></div><span class="v" id="vF">0</span></div>
        <div class="bar"><span class="tag">加速度</span><div class="tr amb"><div id="bA"></div></div><span class="v" id="vA">0</span></div>
      </div>
      <div class="grid3">
        <div><div class="tag">X</div><div class="v" id="pX">0</div></div>
        <div><div class="tag">Y</div><div class="v" id="pY">0</div></div>
        <div><div class="tag">Z</div><div class="v" id="pZ">0</div></div>
      </div>
      <div class="grid3 hide" id="liveTemps">
        <div><div class="tag">噴嘴 NOZZLE</div><div class="v" id="pN">--</div></div>
        <div><div class="tag">熱床 BED</div><div class="v" id="pB">--</div></div>
        <div><div class="tag">速度 SPEED</div><div class="v" id="pS">--</div></div>
      </div>
    </div>

    <div id="side" class="pane"></div>
    <div id="lg"><div class="rail"></div><div class="fill" id="lgFill"></div><div class="mk" id="lgMk"></div><div class="top" id="lgTop"></div><div class="bot">L0</div></div>

    <div id="term" class="pane">

// ---------- 準備區域：從起始程序的段落算出清潔、擠料、調平等工作區 ----------

    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) pp.push(g.x + g.w * i / (nx - 1), g.y + g.h * (j % 2 ? (ny - 1 - 0) : 0) / 1 * 0 + g.h * j / (ny - 1), 0.12);

// ---------- 外殼：用每層外牆輪廓擠出近似的模型形狀（開場用） ----------
let shell, shellLayerEnd;
function buildShell() {
  if (shell) { scene.remove(shell); shell.geometry.dispose(); }
  const moves = data.moves, NL = data.layers.length;
  // 1) 每層收集外牆的連續路徑成一圈一圈
  const loops = Array.from({ length: NL }, () => []);
  let cur = null;
  for (const m of moves) {
    if (m.layer > 0 && m.extrude && m.feature === 'Outer wall') {
      if (!cur || cur.layer !== m.layer || cur.tool !== m.tool || Math.hypot(m.x0 - cur.ex, m.y0 - cur.ey) > 0.05) {
        cur = { layer: m.layer, z: m.z1, h: m.h, tool: m.tool, pts: [[m.x0, m.y0]] }; loops[m.layer].push(cur);
      }
      cur.pts.push([m.x1, m.y1]); cur.ex = m.x1; cur.ey = m.y1;
    } else if (m.len > 1e-6) cur = null;
  }
  const area = p => { let a = 0; for (let i = 0; i < p.length; i++) { const [x1, y1] = p[i], [x2, y2] = p[(i + 1) % p.length]; a += x1 * y2 - x2 * y1; } return a / 2; };
  const inside = ([x, y], p) => { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    const [xi, yi] = p[i], [xj, yj] = p[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };

  const tint = new THREE.Color('#9fdcef'), tc = new THREE.Color();
  shellLayerEnd = new Int32Array(NL + 1);
  for (let l = 0; l < NL; l++) {
    const ls = loops[l].filter(o => o.pts.length >= 4 && Math.abs(area(o.pts)) > 0.5);
    for (const o of ls) { const f = o.pts[0], e = o.pts[o.pts.length - 1]; if (Math.hypot(f[0] - e[0], f[1] - e[1]) < 0.3) o.pts.pop(); o.A = Math.abs(area(o.pts)); o.depth = 0; }

      for (let i = 0; i < gp.length; i++) { pos.push(gp[i]); nor.push(gn[i]); }
      for (let i = 0; i < gp.length / 3; i++) vcol.push(tc.r, tc.g, tc.b);

  sg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  sg.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  sg.setAttribute('color', new THREE.Float32BufferAttribute(vcol, 3));

    uniforms: { uRim: { value: new THREE.Color('#4de2ff') } },
    vertexShader: `varying vec3 vN; varying vec3 vV; varying vec3 vC;

    fragmentShader: `uniform vec3 uRim; varying vec3 vN; varying vec3 vV; varying vec3 vC;
      void main() { vec3 N = normalize(vN), V = normalize(vV);
        float l = 0.35 + 0.45 * max(dot(N, normalize(vec3(-0.4, -0.6, 0.8))), 0.0) + 0.2 * max(N.z, 0.0);
        float fres = pow(1.0 - abs(dot(N, V)), 2.0);

  shell.visible = false;
  scene.add(shell);
}

// ---------- 開場動畫：鏡頭旋轉拉近 → 點雲由下往上長 → 實體由下往上填 ----------
let intro = null, homePose;
const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

const clamp01 = x => Math.min(1, Math.max(0, x));
function startIntro() {
  const T1 = homePose.tgt.clone(), v = homePose.pos.clone().sub(T1);
  const r = v.length(), az = Math.atan2(v.y, v.x), el = Math.atan2(v.z, Math.hypot(v.x, v.y));
  intro = { t0: performance.now(), T1, r, az, el, L: data.layers.length - 1, keepT: t };
  controls.enabled = false;
  $('hudRoot').classList.add('intro');
  $('introTxt').style.opacity = 1;
  extMesh.visible = true; cloud.visible = true; ghost.visible = false; wire.visible = false; curWire.visible = false; travel.visible = false; nozzle.visible = false;
  $('callout').classList.add('hide');

  if (lastPartial >= 0) { setInst(lastPartial, 1); lastPartial = -1; }

    if (files[png]) thumb = URL.createObjectURL(new Blob([await files[png]()], { type: 'image/png' }));
    if (files['Metadata/slice_info.config']) { const x = new TextDecoder().decode(await files['Metadata/slice_info.config']());
      objName = (x.match(/<object [^>]*name="([^"]+)"/) || [])[1];
      // 線材用量（完成畫面用）
      filUse = [...x.matchAll(/<filament [^>]*>/g)].map(m => ({ g: +(m[0].match(/used_g="([\d.]+)"/) || [])[1] || 0, m: +(m[0].match(/used_m="([\d.]+)"/) || [])[1] || 0, color: (m[0].match(/color="(#[0-9A-Fa-f]{6})/) || [])[1], type: (m[0].match(/type="([^"]+)"/) || [])[1] })); }
  } else text = new TextDecoder().decode(buf);
  $('thumb').style.display = thumb ? '' : 'none'; if (thumb) $('thumb').src = thumb;
  const d = parseGcode(text, gcodeFlags); d.objName = objName; d.filUse = filUse;
  maxF = 1; maxA = 1;
  load(d, name.split('/').pop());
}
async function openFile(file) {
  try { await openBuffer(await file.arrayBuffer(), file.name); } catch (e) { alert('讀不了這個檔案：' + e.message); console.error(e); }
}
$('file').onchange = e => e.target.files[0] && openFile(e.target.files[0]);
view.addEventListener('dragover', e => { e.preventDefault(); $('drop').classList.add('hl'); });
view.addEventListener('dragleave', () => $('drop').classList.remove('hl'));
view.addEventListener('drop', e => { e.preventDefault(); $('drop').classList.remove('hl'); const f = e.dataTransfer.files[0]; if (f) openFile(f); });

const qs = new URLSearchParams(location.search);
if (qs.get('file')) fetch(qs.get('file')).then(r => r.arrayBuffer()).then(b => openBuffer(b, qs.get('file'))).then(() => {
  if (qs.get('color')) { $('colorMode').value = qs.get('color'); recolor(); }
  if (qs.get('render')) { $('renderMode').value = qs.get('render'); applyRender(); }
  if (qs.get('travel')) { $('showTravel').checked = true; applyToggles(); }
  if (qs.get('at')) setTime(+qs.get('at'));
  if (qs.get('zoom')) { const z = +qs.get('zoom'), T = homePose.tgt; homePose.pos.sub(T).multiplyScalar(z).add(T); if (intro) intro.r *= z; else { camera.position.copy(homePose.pos); controls.update(); } }
  if (qs.get('rot')) { const r = +qs.get('rot') * Math.PI / 180, T = homePose.tgt, v = homePose.pos.clone().sub(T);
    homePose.pos.copy(T).add(v.applyAxisAngle(new THREE.Vector3(0, 0, 1), r)); if (intro) intro.az += r; else { camera.position.copy(homePose.pos); controls.update(); } }
}).catch(e => console.error(e));
// 沒指定檔案、而且是由 server.mjs 提供的頁面 → 進入即時模式
else fetch('/api/status').then(r => r.ok ? r.json() : null).then(s => { if (s) { onLiveStatus(s); startLive(); } }).catch(() => {});

</script>
